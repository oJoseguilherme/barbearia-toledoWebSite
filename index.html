<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Escolha sua unidade | Barbearia Toledo</title>
  <meta name="description" content="Escolha a matriz 202 Sul ou a filial Palmas Brasil Sul para conhecer a unidade e agendar na Barbearia Toledo.">
  <link rel="stylesheet" href="imagens/fonts-local.css">
  <link rel="stylesheet" href="toledo.css">
  <link rel="stylesheet" href="imagens/fonts-seletor.css">
  <link rel="stylesheet" href="seletor.css">
</head>
<body>
  <main class="entry">
    <header class="entry-head">
      <div class="selector-logo">
        <img src="imagens/marca-dagua-toledo.webp" alt="Barbearia Toledo, cabelo e barba, desde 2015" width="1024" height="1024">
      </div>
    </header>

    <div class="choices">
      <a class="choice" href="filial.html" aria-label="Entrar na filial Palmas Brasil Sul">
        <div class="picture">
          <img src="imagens/fachada-filial.webp" alt="Fachada da filial Palmas Brasil Sul" width="765" height="1020">
        </div>
        <div class="choice-copy">
          <span class="kind">Filial</span>
          <h2>Palmas<br>Brasil Sul</h2>
        </div>
      </a>

      <a class="choice" href="matriz.html" aria-label="Entrar na matriz Avenida Siqueira Campos">
        <div class="picture">
          <img src="imagens/fachada-matriz.webp" alt="Fachada da matriz Avenida Siqueira Campos" width="1109" height="1020">
        </div>
        <div class="choice-copy">
          <span class="kind">Matriz</span>
          <h2>Avenida<br>Siqueira Campos</h2>
        </div>
      </a>
    </div>

    <footer class="entry-foot">
      <div class="foot-pill">
        <span class="pill-dot"></span>
        <h1 class="entry-title">Escolha sua unidade</h1>
        <span class="pill-dot"></span>
      </div>
    </footer>
  </main>
  <script defer src="toledo.js"></script>
</body>
</html>
