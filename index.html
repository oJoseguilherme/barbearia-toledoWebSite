<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Escolha sua unidade | Barbearia Toledo</title><meta name="description" content="Escolha a matriz 202 Sul ou a filial Palmas Brasil Sul para conhecer a unidade e agendar na Barbearia Toledo."><link rel="stylesheet" href="imagens/fonts-local.css"><style>
:root{--bg:#164D50;--surface:#2A6267;--deep:#103C3F;--text:#F2F0E8;--muted:#C3D6D4;--accent:#C4AE88;--line:#ffffff30;--title:'Barlow Condensed','Bahnschrift','Arial Narrow',sans-serif;--body:'Manrope','Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--body)}.entry{min-height:100svh;display:flex;flex-direction:column;justify-content:center;width:min(1240px,calc(100% - 64px));margin:auto;padding:40px 0;gap:40px}.entry-head{text-align:center}.brand{font:600 32px/1 var(--title);letter-spacing:.15em;margin:0}.brand small{display:block;font:400 11px/2 var(--body);letter-spacing:.35em}.entry-head h1{font:600 clamp(40px,5vw,64px)/1.05 var(--title);letter-spacing:-.02em;margin:24px 0 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:32px;perspective:1200px}.choice{display:grid;grid-template-columns:.9fr 1fr;min-width:0;min-height:380px;border-radius:8px;background:var(--surface);border:1px solid var(--line);box-shadow:0 24px 48px #062d3066;text-decoration:none;color:inherit;transform-style:preserve-3d;transition:transform 240ms cubic-bezier(.22,1,.36,1);position:relative}.choice:after{content:'';position:absolute;inset:8px;border:1px solid #ffffff14;border-radius:4px;pointer-events:none}.picture{position:relative;overflow:hidden;border-radius:8px 0 0 8px;min-width:0}.picture img{width:100%;height:100%;object-fit:cover;position:absolute}.choice-copy{display:flex;flex-direction:column;justify-content:center;padding:32px;min-width:0;transform:translateZ(18px)}.kind{font-size:13px;letter-spacing:.15em;color:var(--accent);text-transform:uppercase}.choice h2{font:600 clamp(34px,3.4vw,50px)/1 var(--title);letter-spacing:-.02em;margin:20px 0 16px}.place{font-size:13px;color:var(--muted)}.enter{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding:16px 0;margin-top:24px;font-size:16px}.enter span{color:var(--accent)}.choice:focus-visible{outline:3px solid var(--accent);outline-offset:6px}.choice:active{transform:scale(.98)}@media(hover:hover){.choice:hover{transform:translateY(-6px)}}@media(max-width:900px){.entry{width:calc(100% - 40px);gap:32px}.choice-copy{padding:24px}.choice{min-height:330px}.choices{gap:20px}.choice h2{font-size:36px}}@media(max-width:650px){.entry{width:calc(100% - 32px);padding:24px 0;gap:24px}.brand{font-size:28px}.entry-head h1{font-size:38px;margin-top:16px}.choices{grid-template-columns:1fr;gap:20px}.choice{min-height:230px;grid-template-columns:.8fr 1fr}.choice-copy{padding:24px}.choice h2{font-size:36px;margin:12px 0}.enter{margin-top:12px;padding:12px 0;font-size:14px}.kind{font-size:12px}}@media(max-width:360px){.choice-copy{padding:20px}.choice{min-height:220px}.choice h2{font-size:32px}.entry-head h1{font-size:34px}}@media(prefers-reduced-motion:reduce){.choice{transform:none!important;transition:none}}
</style></head><body><main class="entry"><div class="entry-head"><p class="brand"><small>BARBEARIA</small>TOLEDO</p><h1>Escolha sua unidade.</h1></div><div class="choices"><a class="choice" href="matriz.html" aria-label="Entrar na matriz Avenida Siqueira Campos"><div class="picture"><img src="imagens/video-1-55.jpg" alt="Parede verde da matriz 202 Sul" width="1080" height="1920"></div><div class="choice-copy"><span class="kind">Matriz</span><h2>Avenida<br>Siqueira Campos</h2><span class="place">Palmas, Tocantins</span><span class="enter">Entrar na matriz <span aria-hidden="true">↗</span></span></div></a><a class="choice" href="filial.html" aria-label="Entrar na filial Palmas Brasil Sul"><div class="picture"><img src="imagens/video-2-8.jpg" alt="Ambiente da filial Palmas Brasil Sul" width="720" height="1280"></div><div class="choice-copy"><span class="kind">Filial</span><h2>Palmas<br>Brasil Sul</h2><span class="place">Palmas, Tocantins</span><span class="enter">Entrar na filial <span aria-hidden="true">↗</span></span></div></a></div></main><script>const reduce=matchMedia('(prefers-reduced-motion:reduce)');document.querySelectorAll('.choice').forEach(card=>{card.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||reduce.matches)return;const b=card.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;card.style.transform='rotateX('+(-y*6)+'deg) rotateY('+(x*6)+'deg) translateY(-4px)'});card.addEventListener('pointerleave',()=>card.style.transform='')})</script></body></html>
